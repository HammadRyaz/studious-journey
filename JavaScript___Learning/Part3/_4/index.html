<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../_3/style.css">
    <title>Document</title>
</head>

<body>
    <div class="chat-header">
        <div class="profile">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgT8yOzXEV4gg8tT_eNl_ee_STCfoVLIpu3w&s"
                alt="Hinata" class="profile-pic">
            <div class="user-info">
                <h4>Hinata 💙</h4>
                <p>online</p>
            </div>
        </div>

        <div class="icons">
            <i class="fa-solid fa-video"></i>
            <i class="fa-solid fa-phone"></i>
            <i class="fa-solid fa-ellipsis-v"></i>
        </div>
    </div>
    <div class="container chat-body"></div>

    <!-- 🟩 Footer (message type box) -->
    <div class="chat-footer">
        <i class="fa-regular fa-face-smile emoji"></i>
        <input type="text" placeholder="Type a message">
        <i class="fa-solid fa-paperclip"></i>
        <i class="fa-solid fa-paper-plane send"></i>
    </div>
</body>
<script src="./script.js"></script>

</html>
