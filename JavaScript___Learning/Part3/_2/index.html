<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<style>
    body {
        background-color: #222;
        color: white;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .users {
        width: 300px;
        height: 100px;
        background-color: #555;
        padding: 10px;
        border-radius: 20px;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    #userIMG {
        width: 60px;
        height: 60px;
        border-radius: 50px;
    }

    #userRole {
        background-color: rgb(60, 255, 0);
        color: #222;
        font-weight: bold;
        padding: 3px 7px;
        border-radius: 10px;
    }

    #userForm {
        width: 220px;
        height: 250px;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 5px 5px 5px 5px black;
        border: 1px solid whitesmoke;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        font-size: larger;
    }

    input {
        padding: 8px;
        border-radius: 7px;
        border: none;
    }

    button {
        background-color: lime;
        border: none;
        padding: 5px;
        border-radius: 5px;
    }

    #flex {
        display: flex;
        justify-content: space-between;
        padding: 20px;
    }

    #userContainer {
        display: flex;
        flex-direction: column;
        gap: 5px;
        justify-content: space-around;
    }
</style>

<body>
    <!-- <ol>
        <li>Execution Context</li>
        <li>Lexical Scoping</li>
        <li>Clouser</li>
    </ol> -->

    <div id="flex">
        <form id="userForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"  placeholder="Enter Username" />

            <label for="role">Role:</label>
            <input type="text" id="role" name="role"  placeholder="Enter Role"/>
            <label for="role">Image:</label>
            <input type="url" id="image" name="image"  placeholder="Enter User Image"/>
            <button type="submit">Add User</button>
        </form>

        <div id="userContainer">
        </div>
    </div>

</body>
<!-- <script src="/main.js"></script> -->
<script src="/script.js"></script>
</html>
