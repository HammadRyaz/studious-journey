<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <div class="start-modal">
        <div class="start-game">
            <h3>Start Game</h3>
            <button class="btn btn-start">Start</button>
        </div>
    </div>
    <div class="over-modal">
        <div class="restart-game">
            <h3>Game Over</h3>
            <button class="btn btn-restart">Restart</button>
        </div>
    </div>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score: <span id="high-score">0</span></h3>
                </div>
                <div class="info">
                    <h3>Score: <span id="score"></span></h3>
                </div>
                <div class="info">
                    <h3>Time: <span id="time">00-00</span></h3>
                </div>
            </div>
            <div class="board">
            </div>

        </section>
    </main>
</body>
<script src="script.js"></script>

</html>
