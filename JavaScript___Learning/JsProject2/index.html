<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <main>
        <div class="nav">
            <div class="left">Task Editor</div>
            <button class="right" id="addNewTask">Add New</button>
        </div>
        <div class="board">
            <div class="task-column" id="todo">
                <div class="heading">
                    <div class="left">Todo</div>
                    <div class="right">Count</div>
                </div>
                <div class="task" draggable="true">
                    <h2>Task 1 </h2>
                    <p>Lorem ipsum dolor sit amet.</p>
                    <button class="delete-btn">Delete</button>
                </div>
            </div>
            <div class="task-column" id="progress">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">Count</div>
                </div>

            </div>
            <div class="task-column" id="done">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>

            </div>
        </div>
    </main>
    <div class="modal">
        <input id="taskTitle" type="text" placeholder="Enter Task">
        <input id="taskDesc" value="Lorem ipsum dolor sit amet." type="text" placeholder="Enter Desc">
        <button id="modal-btn">Add Task</button>
        <button class="close-btn"> X </button>
    </div>
</body>
<script src="script.js"></script>

</html>
